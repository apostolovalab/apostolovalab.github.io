# Key publications (rendered by key-publications.Rmd, in this order)
#
#   image      : key from data/images.csv. Must match the `read_more` value of
#                the same paper in data/publications.yml -- authors, note,
#                journal and date are taken from there.
#   image_side : right (default) or left
#   title      : title as displayed here
#   url        : article link, shown in full under the text
#   summary    : text next to the image. Use the folded style (>) and leave
#                an empty line between paragraphs.
#
#   For a paper that is NOT in publications.yml, also add
#   authors, journal, date (and optionally note) here.
