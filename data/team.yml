members:
  - name: "Petya Apostolova"
    title: "Prof. Dr."
    role: "Principal Investigator"
    photo: team_apostolova
    photo_position: "center 20%"
    bio: >
      Petya is an Assistant Professor of Experimental Hematology at the University Hospital Basel. 
      She studied Medicine in Freiburg, Germany, where she also completed her clinical training. 
      In her postdoctoral fellowship at the Max-Planck Institute of Immunobiology and Epigenetics and the 
      Johns Hopkins School of Medicine (USA), she studied how metabolism governs the function and survival 
      of immune and leukemia cells. Clinically, Petya consults patients with hematological malignancies, in 
      particular hematopoietic stem cell transplant recipients. In her research work, she is fascinated by 
      cellular metabolic plasticity and its consequences for cell fate.
    links: [{label: "Google Scholar", url: "https://scholar.google.com/citations?user=eLoa9dIAAAAJ&hl=en"}, 
      {label: "LinkedIn", url: "https://www.linkedin.com/in/petya-apostolova-6abab51b2/"}]

  - name: "Massimo Andreis"
    role: "PhD Student"
    photo: team_andreis
    bio: >
      Massimo studied Cellular and Molecular Biotechnology at the University of Trento, Italy, where he 
      discovered his passion for immunology and metabolic pathways. After spending four years near his 
      beloved mountains, he moved overseas for his master’s thesis, where he investigated the role of cysteine 
      and glutamine in cytotoxic T lymphocytes - and became a big Baltimore Ravens fan (even if he’s still 
      figuring out NFL’s rules).

      To further broaden his knowledge in a more translational context, he joined our lab in Basel as a 
      PhD student. His research focuses on understanding how AML cell metabolism contributes to AML immune 
      escape following allogeneic transplantation by multiomics technologies.

      When he’s not in the lab, Massimo enjoys spending time outdoors: running, hiking, playing football 
      and recovering with a good pizza afterwards!

  - name: "Noa Chemsi Bentires-Alj"
    role: "Master Student"
    photo: placeholder_person # team_chemsi
    bio: >
      Noa Chemsi is a Master’s student in Pharmaceutical Sciences at the University of Geneva, where he also 
      completed his Bachelor’s degree. As part of the final year of his Master’s program, he is undertaking 
      a six-month research internship at the Apostolova Lab.

      Under the supervision of PhD student Tatjana Gremelspracher, his research focuses on understanding 
      the molecular signaling pathways linking FLT3-ITD mutations to increased phosphatidic acid levels in 
      acute myeloid leukemia (AML).
    links: [{label: "LinkedIn", url: "www.linkedin.com/in/noa-chemsi-bentires-alj-3359933a1"}]   

