  - name: "Anthony Sonrel"
    title: "Dr."
    role: "Bioinformatician"
    photo: team_sonrel
    photo_position: "center 30%"
    bio: >
      Anthony joined the BCIM Lab in 2025 as a Bioinformatician. He studied Biology and Bioinformatics at 
      the University of Lausanne and completed a PhD in Statistical Genetics at the University of Zurich in 
      the Robinson Lab. He has worked on diverse analysis projects in both academia and the pharmaceutical 
      industry, ranging from studying obesity through population genetics to developing algorithms for 
      single-cell analysis. 

      At the BCIM Lab, Anthony oversees the generation, analysis, and interpretation of omics data to better 
      understand AML mechanisms. Among his projects, he focuses on integrating multi-omics data and 
      translating statistical signals into meaningful biological findings. He brings his interest for 
      AI, intuitive UI design, and reproducibility into the analysis and code that he develops for the lab.
    links: [{label: "LinkedIn", url: "https://www.linkedin.com/in/anthony-sonrel-612505114/"}, 
      {label: "Google Scholar", url: "https://scholar.google.com/citations?user=okLkFT0AAAAJ"}]   # e.g. - {label: "LinkedIn", url: "https://www.linkedin.com/in/..."}

  - name: "Felix Theiss"
    role: "PhD Student"
    photo: team_theiss
    photo_position: "center 60%"
    bio: >
      Felix earned his Bachelor's degree in Biology and Master's degree in Stem Cell Biology at Ruhr 
      University Bochum, Germany, between 2018 and 2024. During his ten-month Master's thesis in the 
      Lymphoma Laboratory of Prof. Christian Reinhardt at the West German Cancer Center in Essen, he focused 
      on the functional characterization of novel tumor suppressors and oncogenes in diffuse large B-cell lymphoma 
      (DLBCL) and participated in the West German Lymphoma Symposium 2024. In November 2025, he joined the 
      Apostolova Lab, where his PhD research focuses on the role of bioactive lipids in immune evasion of 
      acute myeloid leukemia (AML) following allogeneic hematopoietic stem cell transplantation.
      
      Alongside his scientific career, he is an accomplished professional guitarist. From 2016 to 2025, 
      he held the Guitar 1 chair in Andrew Lloyd Webber's musical Starlight Express in Bochum, Germany. 
      As a live and studio guitarist, he has performed at prestigious venues and events, including the 
      Montreux Jazz Festival, OpenAir St. Gallen, Sony Music Studios in Berlin, and recording studios in 
      Brooklyn, New York City.

  - name: "Johannes Tossounidis"
    title: "Dr."
    role: "Project Leader"
    photo: team_tossounidis
    bio: >
      Jannis studied Medicine at the LMU in Munich. From 2015 to 2016 he performed his MD thesis in the 
      lab of Simon Rothenfußer in the Division of Clinical Pharmacology at the LMU University Hospital on 
      the role of a TRIM-protein in innate antiviral immunity. Since 2020, he is doing his residency in Internal 
      Medicine and Hematology at the University Hospital of Basel. He joined the Apostolova Lab to explore 
      metabolic alternations in the context of AML and allogeneic stem cell transplantation.

      When not in the lab, Jannis enjoys swimming, skiing, reading or visiting his family in Greece, 
      where he can also swim, ski (yes, indeed) and read.
    links: [{label: "LinkedIn", url: "https://www.linkedin.com/in/yannis-tossounidis-64219272/"}]
  
  - name: "Annic Zimmermann"
    role: "Master Student"
    photo:  placeholder_person #team_zimmermann
    bio: >
      Annic studied Molecular Biology at the University of Basel and completed her Bachelor's thesis at 
      the Biozentrum in the Dehio group, where she investigated how human macrophages respond to 
      uropathogenic Escherichia coli.

      Having always been interested in cancer research, she developed a growing interest in immunology 
      during her studies. This led her to join the Apostolova group for her Master's thesis, where she 
      is investigating how acute myeloid leukaemia (AML) changes the behaviour of macrophages in the 
      bone marrow and how these changes help cancer cells escape the immune system.

      After completing her studies, she plans to return to her home canton of Valais, where she hopes 
      to apply the knowledge and experience she gained during her time in Basel. Until then, she 
      enjoys escaping Basel on weekends to recharge in the mountains and enjoy the peace and quiet of 
      Valais.


