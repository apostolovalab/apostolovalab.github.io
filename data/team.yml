  - name: "Tatjana Gremelspacher"
    role: "PhD Student"
    photo: team_gremelspacher
    bio: >
      Tatjana began her scientific journey studying Biology at the University of Freiburg, where she completed 
      her bachelor's thesis in virology. She continued working in the same lab as a student assistant while 
      pursuing her master’s degree in immunobiology at the University of Freiburg. In January 2024, she joined 
      the BCIM lab in Basel for her master’s thesis, just as the lab was launching. Her project focused on lipid 
      metabolism and FLT3-ITD signaling in acute myeloid leukemia (AML), during which she identified a lipid of 
      interest that is deregulated in the context of FLT3-ITD signaling. After completing her thesis, she spent 
      some months at Johns Hopkins University in Baltimore in the lab of Erika Pearce, where she focused on T cell 
      metabolism and amino acid dynamics.

      Despite thoroughly enjoying her time in the U.S. (and developing a minor obsession with Reese’s), 
      Tatjana returned to Basel to begin her PhD, where she is continuing her work on lipid signaling in AML. 
      When she’s not in the lab, you’ll likely find her at the gym, or spending time with her family and friends.
    links: [{label: "LinkedIn", url: "www.linkedin.com/in/tatjana-gremelspacher-0421862b7"}, 
      {label: "ORCID", url: "https://orcid.org/0009-0007-4071-1367"}]

  - name: "Hui Hao-Shen"
    role: "Lab Technician"
    photo: placeholder_person
    bio: >
      I studied medicine in China and have been working for many years as a technician in the Experimental 
      Hematology group within the Department of Biomedicine. I joined the lab in 2024. I am very pleased to 
      have the opportunity to work in the field of translational medicine research. In my spare time, I truly 
      enjoy the magnificent Alps, the charming lakes, and the tranquil natural beauty of Switzerland.

  - name: "Jerneja Koren"
    role: "PhD Student"
    photo: team_koren
    photo_position: "center 20%"
    bio: >
      Jerneja studied Immunology and Pharmacology at the University of Aberdeen in the far northeast of 
      Scotland. For her master’s research project, she moved to the Biozentrum in Basel, where she investigated 
      the role of coronin 2 and 3 in mammalian cells. Captivated by both the science and the city, she decided 
      to return to Switzerland (and Basel) and pursue her PhD in the Apostolova lab. Motivated by her passion 
      for immunology, Jerneja now studies how metabolic rewiring in AML cells shapes the bone marrow environment 
      and influences surrounding non-leukemic cells, often with the help of metabolomics. When she is not busy 
      trying to untangle LC-MS data, you will likely find her running, swimming in the Rhine, or baking the 
      perfect sourdough loaf.
    links: [{label: "LinkedIn", url: "https://www.linkedin.com/in/jerneja-koren/"}]

